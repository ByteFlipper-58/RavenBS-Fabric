name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

# Define required permissions
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.8
        
    - name: Update version if tag
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v',''
        $content = Get-Content -Path gradle.properties
        $content = $content -replace 'mod_version = .*', "mod_version = $version"
        $content | Set-Content -Path gradle.properties
        
    - name: Build with Gradle
      run: gradle build --no-daemon
      
    - name: Calculate JAR Hash
      id: hash
      shell: pwsh
      run: |
        $jar = Get-ChildItem -Path "build/libs" -Filter "*.jar" |
          Where-Object { $_.Name -notmatch '-(sources|dev)\.jar$' } |
          Select-Object -Single
        $hash = Get-FileHash -Path $jar.FullName -Algorithm SHA256
        echo "HASH=$($hash.Hash)" >> $env:GITHUB_ENV
        echo "JAR_NAME=$($jar.Name)" >> $env:GITHUB_ENV
        echo "JAR_PATH=$($jar.FullName)" >> $env:GITHUB_ENV
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: raven-bs-plus-${{ matrix.os }}
        path: ${{ env.JAR_PATH }}
        
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.8
        
    - name: Update version
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v',''
        $content = Get-Content -Path gradle.properties
        $content = $content -replace 'mod_version = .*', "mod_version = $version"
        $content | Set-Content -Path gradle.properties
        
    - name: Build with Gradle
      run: gradle build --no-daemon
      
    - name: Calculate JAR Hash
      id: hash
      shell: pwsh
      run: |
        $jar = Get-ChildItem -Path "build/libs" -Filter "*.jar" |
          Where-Object { $_.Name -notmatch '-(sources|dev)\.jar$' } |
          Select-Object -Single
        $hash = Get-FileHash -Path $jar.FullName -Algorithm SHA256
        echo "HASH=$($hash.Hash)" >> $env:GITHUB_ENV
        echo "JAR_NAME=$($jar.Name)" >> $env:GITHUB_ENV
        echo "JAR_PATH=$($jar.FullName)" >> $env:GITHUB_ENV
      
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      shell: bash
      
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: Release ${{ env.VERSION }}
        draft: false
        prerelease: false
        files: ${{ env.JAR_PATH }}
        generate_release_notes: true
        body: |
          ## RavenBS-Plus-Plus v${{ env.VERSION }}
          
          ### Security Hash
          **File**: ${{ env.JAR_NAME }}
          **SHA256**: ${{ env.HASH }}
          
          ### Integrity Verification
          To verify file integrity on Windows:
          ```powershell
          Get-FileHash -Path "${{ env.JAR_NAME }}" -Algorithm SHA256
          ```
          
          To verify integrity on Linux/Mac:
          ```bash
          shasum -a 256 "${{ env.JAR_NAME }}"
          ```
          
          The hash should match the one shown above.
